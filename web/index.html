<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ledgerly — Receivables, payables & reporting</title>
    <meta name="description" content="Ledgerly is a focused accounts receivable, accounts payable and reporting workspace for small finance teams." />
    <meta name="theme-color" content="#131313" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledgerly" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/motion.css" />
    <link rel="stylesheet" href="/theme-verge.css" />
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #131313; }
      #boot .mark {
        width: 46px; height: 46px; border-radius: 50%;
        background: #3cffd0; color: #000;
        display: grid; place-items: center;
        font: 400 20px/1 Anton, Impact, sans-serif;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 50% { transform: scale(0.94); opacity: 0.7; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="mark">L</div></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
