<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ledgerly — Receivables, payables & reporting</title>
    <meta name="description" content="Ledgerly is a focused accounts receivable, accounts payable and reporting workspace for small finance teams." />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="light" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledgerly" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f5f6f8; }
      #boot .mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(140deg, #17a08c, #0b574c); color: #fff; display: grid; place-items: center; font: 600 19px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: -0.02em; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(0.94); opacity: 0.7; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="mark">L</div></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
